# =============================================================================
# 로컬 인프라: 단일 브로커 Kafka (KRaft 모드) + Kafka UI + Fluent Bit 수집 에이전트
#            + ClickHouse 저장소 + Grafana 대시보드 (Step 4)
#            (+ compare 프로필: 직접 적재 경로용 Fluent Bit 두 개, Step 4+)
#
# 실행:   docker compose -f docker/docker-compose.yml up -d
#         docker compose -f docker/docker-compose.yml --profile compare up -d   (적재 경로 비교 실험)
# 중지:   docker compose -f docker/docker-compose.yml down        (데이터 유지)
#         docker compose -f docker/docker-compose.yml down -v     (데이터 삭제)
# 로그:   docker compose -f docker/docker-compose.yml logs -f kafka
# =============================================================================
name: practice-kafka

services:
  kafka:
    image: apache/kafka:4.2.2
    container_name: kafka
    hostname: kafka
    ports:
      # 호스트(내 PC)에서 접속하는 포트. Spring Boot 앱은 localhost:9092 로 붙는다.
      - "9092:9092"
    environment:
      # ---- KRaft 모드 (ZooKeeper 없음) ----
      # 이 노드 하나가 broker 역할과 controller(메타데이터 관리) 역할을 동시에 수행한다.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"

      # ---- 리스너 ----
      # PLAINTEXT      : 컨테이너 네트워크 내부용 (브로커 간, Kafka UI → 브로커)
      # PLAINTEXT_HOST : 호스트(localhost)용. 앱이 접속하는 주소
      # CONTROLLER     : 컨트롤러 쿼럼 통신용
      KAFKA_LISTENERS: "PLAINTEXT://:19092,PLAINTEXT_HOST://:9092,CONTROLLER://:29093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"

      # ---- 단일 브로커이므로 내부 토픽의 복제 계수를 1로 낮춘다 (기본값 3) ----
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      # 학습 중 실수로 토픽을 자동 생성하지 않도록 끈다. (토픽은 코드/CLI로 명시적으로 만든다)
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      # 클러스터 식별자. base64 형식의 UUID(22자)여야 한다. (kafka-storage.sh random-uuid 로 생성 가능)
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

  kafka-ui:
    # 브라우저에서 토픽/파티션/컨슈머 그룹/메시지를 눈으로 확인하는 도구
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8085:8080"   # http://localhost:8085
    environment:
      KAFKA_CLUSTERS_0_NAME: "local-single"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:19092"
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      kafka:
        condition: service_healthy

  fluent-bit:
    # 수집 에이전트. ./devices/*.log 를 tail 해서 호스트의 Spring 앱(localhost:8080)으로 HTTP 전송한다.
    # Spring 앱이 떠 있지 않으면 재시도하며 디스크 버퍼에 쌓아둔다. (앱을 나중에 띄워도 된다)
    image: fluent/fluent-bit:4.2
    container_name: fluent-bit
    ports:
      - "2020:2020"   # http://localhost:2020/api/v1/metrics  (입력/출력/재시도 건수)
    volumes:
      - ./fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ./devices:/var/log/devices:ro
      - fluent-bit-state:/fluent-bit/db
      - fluent-bit-storage:/fluent-bit/storage
    extra_hosts:
      # Linux 에서도 host.docker.internal 이 호스트를 가리키게 한다 (Docker Desktop 은 기본 제공)
      - "host.docker.internal:host-gateway"

  clickhouse:
    # 로그 저장소 (Step 4, 명세서 지정). 25.8 은 LTS 다. 앱의 적재 컨슈머(sink/)가 HTTP 인터페이스로 INSERT 한다.
    image: clickhouse/clickhouse-server:25.8
    container_name: clickhouse
    ports:
      - "8123:8123"   # HTTP 인터페이스. http://localhost:8123/play 는 브라우저 SQL 창 (사용자 app / 암호 app)
    environment:
      # 처음 뜰 때 이 DB 와 사용자를 만든다. 앱의 app.clickhouse.* 와 맞춘다.
      CLICKHOUSE_DB: logs
      CLICKHOUSE_USER: app
      CLICKHOUSE_PASSWORD: app
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      # 데이터 디렉터리가 비어 있을 때만 실행되는 초기화 SQL (logs.app_logs 테이블)
      - ./clickhouse/init:/docker-entrypoint-initdb.d:ro
      # part 가 생기고 합쳐지는 이력(system.part_log)을 남긴다. part 와 병합을 눈으로 보는 실습에 쓴다
      - ./clickhouse/config.d/part_log.xml:/etc/clickhouse-server/config.d/part_log.xml:ro
      # Step 4+ 비교 실험용 SQL(비교 테이블, Kafka 테이블 엔진, 비교 쿼리). 자동 실행되지 않고 clickhouse-client --queries-file 로 직접 돌린다
      - ./clickhouse/compare:/compare:ro
    ulimits:
      # ClickHouse 는 part 파일을 많이 연다. 공식 이미지 문서가 권하는 값.
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user app --password app --query 'SELECT 1' > /dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20

  grafana:
    # 대시보드 (Step 4). ClickHouse 플러그인과 데이터 소스, 대시보드 하나를 파일로 미리 넣어 둔다(provisioning).
    image: grafana/grafana:11.6.0
    container_name: grafana
    ports:
      - "3000:3000"   # http://localhost:3000 (admin / admin. 보기만 할 때는 로그인 없이 열린다)
    environment:
      # 첫 기동 때 인터넷에서 ClickHouse 데이터 소스 플러그인을 받는다. 망분리 환경이면 플러그인 파일을 미리 넣어야 한다.
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      # 학습용: 로그인하지 않아도 대시보드를 볼 수 있게 한다(보기 권한만)
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      clickhouse:
        condition: service_healthy

  # ===========================================================================
  # Step 4+ 적재 경로 비교용. --profile compare 를 붙여야 뜬다. 프로필 없이 up 하면 위 서비스만 떠서 Step 4 와 같다.
  # 두 에이전트는 위 fluent-bit 과 같은 파일을 같은 규칙으로 읽고, 보내는 곳(INGEST_URI)만 다르다.
  # 읽은 위치(tail.db)와 디스크 버퍼를 각자 따로 가지므로 세 에이전트는 서로 독립이다. 한 경로가 막혀도 다른 경로는 계속 흐른다.
  # 앱은 app.compare.enabled=true 로 띄워야 /ingest/direct 가 열린다.
  # ===========================================================================
  fluent-bit-direct:
    # 장비 → /ingest/direct → ClickHouse. HTTP 묶음 하나가 INSERT 한 번이 된다.
    image: fluent/fluent-bit:4.2
    container_name: fluent-bit-direct
    profiles: ["compare"]
    ports:
      - "2021:2020"   # http://localhost:2021/api/v1/metrics  (직접 적재 경로의 재시도 건수)
    environment:
      INGEST_URI: /ingest/direct
    volumes:
      - ./fluent-bit/fluent-bit-direct.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ./devices:/var/log/devices:ro
      - fluent-bit-direct-state:/fluent-bit/db
      - fluent-bit-direct-storage:/fluent-bit/storage
    extra_hosts:
      - "host.docker.internal:host-gateway"

  fluent-bit-direct-async:
    # 장비 → /ingest/direct?async=true → ClickHouse 비동기 INSERT. 서버가 여러 요청을 모아 part 하나로 쓴다.
    image: fluent/fluent-bit:4.2
    container_name: fluent-bit-direct-async
    profiles: ["compare"]
    ports:
      - "2022:2020"   # http://localhost:2022/api/v1/metrics
    environment:
      INGEST_URI: /ingest/direct?async=true
    volumes:
      - ./fluent-bit/fluent-bit-direct.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ./devices:/var/log/devices:ro
      - fluent-bit-direct-async-state:/fluent-bit/db
      - fluent-bit-direct-async-storage:/fluent-bit/storage
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  kafka-data:
  fluent-bit-state:
  fluent-bit-storage:
  clickhouse-data:
  grafana-data:
  fluent-bit-direct-state:
  fluent-bit-direct-storage:
  fluent-bit-direct-async-state:
  fluent-bit-direct-async-storage:
