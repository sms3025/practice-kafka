# =============================================================================
# 직접 적재 경로용 Fluent Bit (Step 4+, compose 의 compare 프로필 전용)
#
# 파이프라인:  [INPUT tail] 장비 로그 파일 → [OUTPUT http] 수집 서버 ${INGEST_URI} → ClickHouse (Kafka 없음)
#
# fluent-bit-direct 와 fluent-bit-direct-async 두 컨테이너가 이 파일 하나를 함께 쓰고, 보낼 곳만 환경 변수 INGEST_URI 로 바꾼다.
# 입력은 fluent-bit.conf 와 똑같다. 같은 파일을 같은 규칙으로 읽어야 경로끼리 공정하게 비교할 수 있기 때문이다.
# fluent-bit.conf 와 다른 것은 셋이다. 보내는 곳(URI), 재시도 대기 상한(scheduler.cap), 컨테이너마다 따로인 볼륨(tail.db, 디스크 버퍼).
# 각 항목의 뜻은 fluent-bit.conf 의 주석을 본다. 입력 규칙을 바꾸면 두 파일을 함께 고친다.
# =============================================================================

[SERVICE]
    Flush                     1
    Log_Level                 info
    HTTP_Server               On
    HTTP_Listen               0.0.0.0
    HTTP_Port                 2020
    storage.path              /fluent-bit/storage
    storage.sync              normal
    storage.checksum          off
    storage.backlog.mem_limit 50M
    storage.metrics           on
    # 실패한 묶음을 다시 보내기까지의 대기는 재시도할 때마다 두 배로 늘어난다(지터 포함). 기본 상한은 2000초다.
    # ClickHouse 를 3분 멈추는 장애 실험에서 복구 뒤 수십 분을 기다리지 않도록 상한을 60초로 둔다.
    # Kafka 경유 경로는 Kafka 가 받아 주므로 이 값의 영향을 받지 않는다. 직접 적재에서는 이 값이 곧 복구 시간의 일부다.
    scheduler.base            2
    scheduler.cap             60

[INPUT]
    Name              tail
    Path              /var/log/devices/*/UILogger/*.log,/var/log/devices/*/OHTHandlerLogger/*/*.txt,/var/log/devices/sim/*.log
    Tag               device.*
    Path_Key          source
    Offset_Key        offset
    DB                /fluent-bit/db/tail.db
    Read_from_Head    On
    Refresh_Interval  5
    Buffer_Max_Size   256k
    Skip_Empty_Lines  On
    Inotify_Watcher   Off
    storage.type      filesystem
    Mem_Buf_Limit     50MB

[OUTPUT]
    Name              http
    Match             device.*
    Host              host.docker.internal
    Port              8080
    # 여기만 다르다. compose 가 컨테이너마다 /ingest/direct 또는 /ingest/direct?async=true 를 넣어 준다.
    URI               ${INGEST_URI}
    Format            json
    Json_date_key     collected_at
    Json_date_format  iso8601
    Header            Content-Type application/json
    # 무한 재시도. ClickHouse 가 멈춰 있는 동안 수집 서버는 500 을 돌려주고, 밀린 로그는 이 컨테이너의 디스크 버퍼에서 기다린다.
    Retry_Limit       False
