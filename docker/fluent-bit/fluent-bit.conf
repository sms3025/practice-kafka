# =============================================================================
# Fluent Bit 수집 에이전트 설정 (명세서: "Fluent Bit 설정 기반 데이터 수집 에이전트")
#
# 파이프라인:  [INPUT tail] 장비 로그 파일 → [OUTPUT http] 수집 서버(Spring) /ingest/fluentbit
#
# 실제 운영에서는 이 설정 파일을 장비 1,000대 각각에 배포하고, Host 만 중앙 수집 서버 주소로 바꾼다.
# 연습에서는 컨테이너 하나가 docker/devices/*.log 전체를 tail 해서 1,000대 몫을 대신한다.
# =============================================================================

[SERVICE]
    # 버퍼를 비우는(출력으로 내보내는) 주기(초). 작을수록 지연이 짧고 요청 수가 많다.
    Flush                     1
    Log_Level                 info
    # Fluent Bit 자체 상태 확인용 HTTP 서버. http://localhost:2020/api/v1/metrics 로 입력/출력 건수와 재시도 횟수를 본다.
    HTTP_Server               On
    HTTP_Listen               0.0.0.0
    HTTP_Port                 2020
    # 메모리 버퍼가 차거나 에이전트가 재시작돼도 잃지 않도록 디스크 버퍼를 켠다 ("무손실 전송"의 핵심).
    storage.path              /fluent-bit/storage
    storage.sync              normal
    storage.checksum          off
    storage.backlog.mem_limit 50M

[INPUT]
    Name              tail
    # 장비 로그 파일. docker-compose 에서 ./devices 를 이 경로에 마운트한다. 패턴은 콤마로 여러 개.
    #   OHT 차량 로그 (ohtsim 생성기 출력):  <장비ID>/UILogger/*.log  와  <장비ID>/OHTHandlerLogger/<계열>/*.txt
    #   연습용 단순 로그 (DeviceLogSimulator): sim/*.log
    Path              /var/log/devices/*/UILogger/*.log,/var/log/devices/*/OHTHandlerLogger/*/*.txt,/var/log/devices/sim/*.log
    # 레코드의 태그. * 는 파일 경로로 치환된다 → device.var.log.devices.OHT-0001.UILogger.APP_20260105_09.log
    Tag               device.*
    # 레코드에 원본 파일 경로를 "source" 키로 넣는다 (명세서 스키마의 source)
    Path_Key          source
    # 레코드에 파일 내 바이트 오프셋을 "offset" 키로 넣는다 (명세서 스키마의 offset, 멱등키 재료)
    Offset_Key        offset
    # 어디까지 읽었는지 SQLite 에 기록 → 에이전트가 재시작해도 이어서 읽는다. 중복/누락 방지의 1차 장치.
    DB                /fluent-bit/db/tail.db
    # 처음 발견한 파일은 끝이 아니라 처음부터 읽는다 (기본값 Off 면 기존 내용은 건너뛴다)
    Read_from_Head    On
    # 새 파일을 찾는 주기(초). OHT 로그는 1시간마다 새 파일이 생기므로 이 주기로 발견한다.
    Refresh_Interval  5
    # 파일 하나에서 한 번에 읽는 최대 크기. 1대당 60줄/s 수준이면 기본값(32k)으로 충분하다.
    Buffer_Max_Size   256k
    Skip_Empty_Lines  On
    # Windows/macOS 의 Docker 바인드 마운트에서는 inotify 이벤트가 안 오는 경우가 있어 폴링 방식으로 바꾼다.
    Inotify_Watcher   Off
    # 이 입력의 버퍼를 디스크(storage.path)에 둔다
    storage.type      filesystem
    Mem_Buf_Limit     50MB

[OUTPUT]
    Name              http
    Match             device.*
    # 컨테이너에서 호스트(IntelliJ 로 띄운 Spring 앱)에 접속하는 특수 호스트명
    Host              host.docker.internal
    Port              8080
    URI               /ingest/fluentbit
    # 본문을 JSON 배열로 보낸다 (json_lines 로 바꾸면 줄 단위 스트림)
    Format            json
    # 수집 시각을 담을 키 이름과 형식 (명세서 스키마의 collected_at)
    Json_date_key     collected_at
    Json_date_format  iso8601
    Header            Content-Type application/json
    # 2xx 가 아니면 무한 재시도 (False = 제한 없음). 수집 서버가 죽어도 디스크 버퍼에 쌓아뒀다 보낸다.
    Retry_Limit       False
    # gzip 압축 전송은 명세서의 "전송 최적화" 단계에서 켠다. (수집 서버가 Content-Encoding: gzip 을 풀어야 한다)
    # compress          gzip
