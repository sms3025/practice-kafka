# Grafana 가 뜰 때 ClickHouse 데이터 소스를 만든다 (Step 4).
# 컨테이너끼리는 docker 네트워크 이름(clickhouse)과 컨테이너 안 포트(8123)로 붙는다. 사용자·암호는 compose 의 CLICKHOUSE_* 와 같다.
apiVersion: 1
datasources:
  - name: ClickHouse
    uid: clickhouse
    type: grafana-clickhouse-datasource
    isDefault: true
    jsonData:
      host: clickhouse
      port: 8123
      protocol: http
      username: app
      defaultDatabase: logs
    secureJsonData:
      password: app
