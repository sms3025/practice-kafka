# =============================================================================
# practice-kafka 설정
# 각 항목이 "왜" 필요한지는 docs/result/ 의 단계별 문서 참고
# =============================================================================
spring.application.name=practice-kafka
server.port=8080

# -----------------------------------------------------------------------------
# 공통: 브로커 주소. docker/docker-compose.yml 의 PLAINTEXT_HOST 리스너(localhost:9092)
# 여러 개면 콤마로 나열한다. 클라이언트는 이 중 하나에 붙어 전체 클러스터 메타데이터를 받아온다.
# -----------------------------------------------------------------------------
spring.kafka.bootstrap-servers=localhost:9092

# -----------------------------------------------------------------------------
# Producer
# -----------------------------------------------------------------------------
# 키는 문자열(device_id), 값은 LogEvent 객체를 JSON 으로 직렬화
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
# 메시지 헤더에 Java 타입 정보(__TypeId__)를 넣지 않는다.
# 컨슈머 쪽에서 default.type 으로 역직렬화 타입을 지정하므로 불필요하며, 다른 언어 컨슈머와도 호환된다.
spring.kafka.producer.properties[spring.json.add.type.headers]=false

# acks: 브로커가 "받았다"고 응답하는 기준.
#   0   = 응답 안 기다림(가장 빠르지만 유실 가능)
#   1   = 리더 파티션에 기록되면 응답
#   all = ISR(동기화된 모든 복제본)에 기록되면 응답 (가장 안전, Kafka 3.0+ 기본값)
spring.kafka.producer.acks=all
# 재시도 횟수 (기본 Integer.MAX, delivery.timeout.ms 가 실질적 상한)
spring.kafka.producer.retries=3
# 배치: 같은 파티션으로 가는 메시지를 모아서 보낸다. linger.ms 만큼 기다리거나 batch.size 가 차면 전송.
spring.kafka.producer.batch-size=16384
spring.kafka.producer.properties[linger.ms]=5

# -----------------------------------------------------------------------------
# Consumer
# -----------------------------------------------------------------------------
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
# 타입 헤더가 없으므로 어떤 클래스로 역직렬화할지 명시
spring.kafka.consumer.properties[spring.json.value.default.type]=com.practice.kafka.log.LogEvent
# 역직렬화를 허용할 패키지 (보안: 임의 클래스 역직렬화 방지)
spring.kafka.consumer.properties[spring.json.trusted.packages]=com.practice.kafka
# 커밋된 오프셋이 없는 "새 그룹"이 처음 붙을 때 어디서부터 읽을지. earliest=처음부터, latest=지금부터
spring.kafka.consumer.auto-offset-reset=earliest

# 리스너 하나가 띄우는 컨슈머 스레드 수 (Step 3). 스레드마다 KafkaConsumer 가 하나씩 생기고, 같은 그룹 안에서 파티션을 나눠 갖는다.
# 파티션 6개에 3이면 스레드당 2개. 앱을 하나 더 띄우면 그룹의 컨슈머가 6개가 되어 1개씩. 파티션보다 많아진 스레드는 놀게 된다.
# 이 값은 Spring Boot 가 만드는 기본 리스너 팩토리에 걸리므로 log-printer 와 log-stats 둘 다 3이다.
spring.kafka.listener.concurrency=3

# -----------------------------------------------------------------------------
# 애플리케이션 고유 설정 (app.* 는 우리가 정의한 키)
# -----------------------------------------------------------------------------
app.kafka.topics.app-logs.name=app-logs
# 파티션 수 = 같은 그룹 안에서 동시에 읽을 수 있는 컨슈머 수의 상한 (Step 3 에서 3 → 6).
# 이미 3개로 있는 토픽이면 앱이 뜰 때 KafkaAdmin 이 6개로 늘린다. 줄이는 것은 Kafka 가 허용하지 않는다.
# 늘리면 키 → 파티션 계산(murmur2(key) % 파티션 수)이 바뀌어, 같은 장비의 로그가 늘린 시점 앞뒤로 다른 파티션에 들어간다.
app.kafka.topics.app-logs.partitions=6
# 단일 브로커이므로 1. 3브로커 단계에서 3으로 올린다.
app.kafka.topics.app-logs.replicas=1
# 컨슈머 그룹. 그룹마다 같은 메시지를 따로 전부 받는다(그룹 간 브로드캐스트). 그룹 안에서는 파티션을 나눠 받는다.
app.kafka.consumer-groups.printer=log-printer
# Step 3: 레벨별 건수를 세는 두 번째 그룹. log-printer 와 같은 메시지를 독립적으로 받는다.
app.kafka.consumer-groups.stats=log-stats

# 장비가 로그에 찍는 시각의 타임존. LogNormalizer 가 event_time 을 UTC 로 바꿀 때 기준이 된다.
app.ingest.device-zone=Asia/Seoul
# 파일 경로에서 장비 ID 를 찾는 정규식 (그룹 1 이 ID). OHT-0001, VH-0123 같은 폴더 이름에 맞춘 기본값.
# 주의: .properties 에서 \d 는 백슬래시가 사라지므로 [0-9] 로 쓴다.
app.ingest.device-id-pattern=([A-Z]{2,5}-[0-9]{3,5})

# 연습용 단순 로그 시뮬레이터. dir 은 docker-compose 에서 Fluent Bit 컨테이너에 마운트되는 docker/devices 아래여야 한다.
# (IntelliJ 실행 시 작업 디렉터리가 프로젝트 루트라고 가정한 상대 경로). OHT 생성기 출력은 docker/devices/<장비ID>/... 에 둔다.
app.simulator.dir=docker/devices/sim
app.simulator.devices=20
app.simulator.lines-per-second=20
# true 로 바꾸면 앱이 떠 있는 동안 1초마다 lines-per-second 줄을 계속 쓴다. false 면 POST /api/logs/simulate 로 수동 기록.
app.simulator.enabled=false

# -----------------------------------------------------------------------------
# Step 4: 적재 컨슈머 (sink/ 패키지, Kafka → ClickHouse)
# ClickHouse 가 떠 있지 않아도 앱은 뜬다. 적재만 실패하고, ClickHouse 가 뜰 때까지 같은 묶음을 1초 간격으로 다시 시도한다.
# 끄려면 false (테스트는 끈다). 처리량 실측은 kafka-load-test 브랜치의 docs/result/benchmark-transport.md 7.3절.
# -----------------------------------------------------------------------------
app.sink.enabled=true
# 적재할 토픽과 컨슈머 그룹. log-printer, log-stats 와 다른 그룹이라 같은 메시지를 따로 전부 받는다.
app.sink.topic=${app.kafka.topics.app-logs.name}
app.sink.group=clickhouse-sink
# 적재 컨슈머 스레드 수. 하나로 초당 약 14.7만 행을 넣는다(브랜치 실측, 장비 약 2,400대 분량). 파티션 수(6)까지 늘릴 수 있다.
app.sink.concurrency=1
# poll 한 번에 받을 최대 건수 = INSERT 한 번의 최대 행 수. 기본값 500 이면 INSERT 가 너무 잦아 ClickHouse 에 part 가 쌓인다.
app.sink.max-poll-records=20000
# 브로커가 1MB 모일 때까지(또는 500ms 가 지날 때까지) 응답을 미룬다. 로그가 띄엄띄엄 와도 묶음이 작게 쪼개지지 않게 한다.
# 대신 적재가 최대 0.5초 늦어진다. 묶음 크기와 지연을 맞바꾸는 손잡이다.
app.sink.fetch-min-bytes=1048576
app.sink.fetch-max-wait-ms=500
# 파티션 하나에서 한 번에 가져올 최대 바이트. 기본값 1MB 로는 20,000건(약 11MB) 묶음이 잘 차지 않는다.
app.sink.max-partition-fetch-bytes=8388608

# ClickHouse 접속. HTTP 인터페이스(8123)를 쓴다. 사용자·암호·DB 는 docker-compose.yml 의 CLICKHOUSE_* 와 같아야 한다.
app.clickhouse.url=http://localhost:8123
app.clickhouse.user=app
app.clickhouse.password=app
app.clickhouse.database=logs
app.clickhouse.table=app_logs
# 동시 INSERT 연결 수 상한. 적재 컨슈머만 쓸 때는 스레드 수(1)보다 넉넉하면 된다.
# Step 4+ 직접 적재에서는 HTTP 요청마다 INSERT 가 하나씩 동시에 열린다. 비동기 INSERT 는 서버 버퍼가 비워질 때까지(최대 0.2초) 연결을 붙잡으므로
# 장비 100대(초당 요청 약 93개 x 0.19초)면 평균 17개쯤이 동시에 열려 있다(2026-10-19). 모자라면 요청이 연결을 기다리느라 지연이 경로 탓이 아닌 설정 탓이 된다.
app.clickhouse.max-connections=64

# -----------------------------------------------------------------------------
# Step 4+: 적재 경로 비교 (direct/ 패키지, POST /ingest/direct)
# Kafka 를 거치지 않고 HTTP 묶음을 받자마자 ClickHouse 에 넣는 경로. 비교 실험 때만 켠다.
# 켜면 compose 의 compare 프로필(fluent-bit-direct, fluent-bit-direct-async)이 같은 로그를 이 경로로 보낸다.
# 테이블은 docker/clickhouse/compare/01-compare-tables.sql 로 만든다 (app_logs 와 같은 구조, 이름만 다름).
# -----------------------------------------------------------------------------
app.compare.enabled=false
# HTTP 묶음 하나 = INSERT 한 번 = part 하나
app.compare.direct-table=app_logs_direct
# 같은 묶음을 async_insert=1 로 넣는다. ClickHouse 가 여러 INSERT 를 모아 part 하나로 쓴다
app.compare.direct-async-table=app_logs_direct_async

# -----------------------------------------------------------------------------
# 로깅 / Actuator
# -----------------------------------------------------------------------------
logging.level.com.practice.kafka=INFO
# 프로듀서가 파티션/오프셋을 어디에 썼는지, Fluent Bit 묶음이 몇 건씩 오는지 보려면 DEBUG
logging.level.com.practice.kafka.producer=DEBUG
logging.level.com.practice.kafka.ingest=DEBUG
# Kafka 클라이언트 내부 로그는 기동 시 설정 덤프가 길어서 WARN 으로 줄인다.
logging.level.org.apache.kafka=WARN
management.endpoints.web.exposure.include=health,info,metrics,shutdown
# POST /actuator/shutdown 으로 앱을 정상 종료한다 (Step 3). Windows 에는 SIGTERM 이 없어 Stop-Process 는 곧 강제 종료다.
# 정상 종료하면 컨슈머가 그룹을 떠난다고 알려 리밸런스가 바로 일어나고, 강제 종료하면 브로커가 세션 타임아웃(45초)까지 기다린다.
# 그 차이를 보려고 연다. 인증 없이 누구나 앱을 끌 수 있으므로 운영 서버에서는 열면 안 된다.
management.endpoint.shutdown.access=unrestricted
